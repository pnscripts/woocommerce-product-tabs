name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: WPCS, PHPStan, unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer lint
      - run: composer analyse
      - run: composer test

  integration:
    name: Integration (WP ${{ matrix.wp }}, WC ${{ matrix.wc }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: 'latest', wc: 'latest-stable', php: '8.3' }
          - { wp: '6.5.5', wc: '9.0.2', php: '8.1' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: WordPress + WooCommerce + YIKES on SQLite
        run: WP_DIR=$PWD/.cache/wp-test WP_VERSION=${{ matrix.wp }} WC_VERSION=${{ matrix.wc }} bin/setup-wp.sh
      - run: WP_DIR=$PWD/.cache/wp-test composer test:integration

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/build-zip.sh
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/pnscripts-product-tabs
